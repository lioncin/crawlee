<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>同泽CRM 数据抓取</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;600;700&family=Noto+Sans+SC:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="page">
      <section class="panel hero">
        <p class="kicker">Data Console</p>
        <h1>同泽CRM 数据抓取</h1>
      </section>
      <section class="panel source-panel">
        <div class="result-head">
          <h2>本次数据抓取 URL</h2>
          <span id="sourceStatusText" class="status"></span>
        </div>
        <p class="subtitle">根据输入的URL地址，去查找页面中的公司信息</p>
        <form id="sourceForm" class="source-form">
          <input id="sourceName" type="text" maxlength="128" placeholder="数据源名称，例如：上交所 IPO" required />
          <input id="sourceUrl" type="url" maxlength="2048" placeholder="https://example.com/list" required />
          <label class="source-active"><input id="sourceActive" type="checkbox" checked /> 启用抓取</label>
          <button id="sourceSaveBtn" type="submit">新增 URL</button>
          <button id="sourceCancelBtn" type="button" class="secondary-btn" hidden>取消编辑</button>
        </form>
        <div id="sourceList" class="source-list"><p class="empty">正在加载数据源...</p></div>
      </section>
      <div class="actions-row">
        <button id="startQueryBtn" type="button">开始抓取</button>
        <button id="queryBtn" type="button">查看</button>
      </div>
      <p id="fetchProgressText" class="fetch-progress" aria-live="polite">等待开始抓取</p>
      <section class="panel result">
        <div class="result-head">
          <h2>查询结果</h2>
          <span id="statusText" class="status">等待查询</span>
        </div>
        <div id="resultTables" class="result-tables"></div>
      </section>
    </main>

    <script src="./app.js"></script>
  </body>
</html>
