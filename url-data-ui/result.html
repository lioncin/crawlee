<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>同泽CRM 数据抓取</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;600;700&family=Noto+Sans+SC:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="page">
      <section class="panel hero">
        <p class="kicker">Data Console</p>
        <h1>同泽CRM 数据抓取</h1>
      </section>

      <section class="panel analysis-target-panel">
        <div class="analysis-target-head">
          <label for="analysisTargetSelect">选择分析目标</label>
          <select id="analysisTargetSelect" class="analysis-target-select">
            <option value="销售一部(minitab)">销售一部(minitab)</option>
            <option value="销售一部(WPS)">销售一部(WPS)</option>
            <option value="销售一部(office)">销售一部(office)</option>
            <option value="销售一部(workbuddy)">销售一部(workbuddy)</option>
            <option value="销售二部(minitab)">销售二部(minitab)</option>
            <option value="销售二部(WPS)">销售二部(WPS)</option>
            <option value="销售二部(office)">销售二部(office)</option>
            <option value="销售二部(workbuddy)">销售二部(workbuddy)</option>
          </select>
        </div>
        <div id="analysisRuleText" class="analysis-rule" aria-live="polite"></div>
      </section>

      <section class="panel ai-toolbar">
        <div class="ai-toolbar-inner">
          <h2>AI分析</h2>
          <button id="aiAnalyzeBtn" type="button">AI分析</button>
          <button id="syncToCrmBtn" type="button">同步到CRM</button>
          <span id="aiStatusText" class="status"></span>
        </div>
        <p id="aiRunHint" class="ai-run-hint"></p>
      </section>

      <section class="panel ai-result compact-ai-result">
        <h2>AI分析结果</h2>
        <div class="ai-result-controls">
          <input id="aiCompanySearch" class="ai-filter-input" type="text" placeholder="按公司名搜索" />
          <select id="aiGradeFilter" class="ai-filter-select">
            <option value="ALL">全部等级</option>
            <option value="A">A级</option>
            <option value="B">B级</option>
            <option value="C">C级</option>
            <option value="D">D级</option>
          </select>
          <button id="aiExportCsvBtn" type="button" class="ai-export-btn">导出CSV</button>
          <span id="aiFilterSummary" class="ai-filter-summary"></span>
        </div>
        <div id="aiResultBoard" class="ai-result-board">
          <p class="empty">点击上方 AI分析 按钮后显示结果</p>
        </div>
      </section>

    </main>

    <script src="./result.js"></script>
  </body>
</html>
